name: Auto-merge Claude PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  check-and-merge:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tolak jika menyentuh .github/
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^\.github/'; then
            echo "PR mengubah .github/, tidak di-merge otomatis"; exit 1
          fi
      - name: Cek sintaks semua file .js
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch --repo ${{ github.repository }}
